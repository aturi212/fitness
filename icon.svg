<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- ONIX · icono de la PWA (12-nov-2026): el logo de la app, las dos barras
       inclinadas, en hueso sobre negro con el resplandor rojo de marca (#C8231E).
       Cuadrado y SIN transparencia: iOS aplica su propia máscara squircle.
       Dentro de un SVG las referencias van con url(#id), nunca %23. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.5" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.02" r="0.78">
      <stop offset="0" stop-color="#C8231E" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#C8231E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C8231E" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>
  <rect width="100" height="100" filter="url(#grain)" opacity="0.12" style="mix-blend-mode:overlay"/>
  <!-- Las dos barras del logo (.logo i: 11×14, separadas 4, skewX(-16°)) -->
  <g fill="#ECE8E1">
    <path d="M20 64 L28 36 L50 36 L42 64 Z"/>
    <path d="M50 64 L58 36 L80 36 L72 64 Z"/>
  </g>
</svg>
